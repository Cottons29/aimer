[package]
name = "aimer_cupid"
version = "0.1.0"
edition = "2024"
description = "A rendering engine that optimized for the ui framework"

[features]
default = ["apple-core-text", "wgpu"]
# Keep the compatibility renderer and the WGPU adapter optional so the
# experimental generic renderer can be built with a native backend alone.
wgpu = ["dep:wgpu", "dep:winit"]
# Keep optional checked-in fallback faces out of native downstream binaries
# unless an application explicitly opts into deterministic bundled rendering.
# wasm always carries the generic Latin/monospace faces because browsers do not
# expose readable system font files to Cupid.
bundled-fonts = []
# The production profile owns standard-font parsing, shaping, fallback-aware
# resolution, and rasterization. The optional Apple-private backend is kept
# separate below so the portable path remains available on every platform.
apple-core-text = [
    "dep:objc2-core-foundation",
    "dep:objc2-core-text",
    "dep:objc2-core-graphics",
]
# Experimental: expose the GpuBackend trait path and `RendererImpl<B>`, which
# can be built with WGPU or one of the native Metal, D3D12, and Vulkan backends.
pluggable-backend-exp = []
# Experimental: native Metal backend via objc2-metal.
# Implies pluggable-backend-exp. Only compiles on macOS/iOS, because the
# objc2-metal dependency below is declared in an Apple target table.
metal = [
    "pluggable-backend-exp",
    "apple-core-text",
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:objc2",
    "dep:objc2-quartz-core",
]
# Native Direct3D 12 backend. Combine with `--no-default-features` to keep
# WGPU out of the dependency graph.
dx12 = ["dep:windows", "pluggable-backend-exp"]
# Native Direct3D 12 windowed demo. Requires `--no-default-features` to omit WGPU.
dx12-demo = ["dx12", "dep:winit", "dep:raw-window-handle"]
# Native Vulkan backend and optional windowed demo.
vulkan = ["dep:ash", "dep:ash-window", "dep:raw-window-handle", "pluggable-backend-exp"]
vulkan-demo = ["vulkan", "dep:winit"]
# Native OpenGL 3.3 Core backend. Loads the platform OpenGL entry points directly.
opengl = ["dep:raw-window-handle", "pluggable-backend-exp"]
# Optional windowed demo for the direct OpenGL backend. Use with
# `--no-default-features` to omit WGPU.
opengl-demo = ["opengl", "dep:winit"]
metal-demo = [
    "metal",
    "dep:winit",
    "dep:raw-window-handle",
    "dep:objc2-app-kit",
]
[[bin]]
path = "src/bin.rs"
name = "cupid"
required-features = ["wgpu"]

[[bin]]
path = "src/bin_metal.rs"
name = "cupid-metal"
required-features = ["metal-demo"]

[[bin]]
path = "src/bin_dx12.rs"
name = "cupid-dx12"
required-features = ["dx12-demo"]

[[example]]
name = "image_scroll_memory_profile"
required-features = ["wgpu"]

[[example]]
name = "text_decoration_benchmark"
required-features = ["wgpu"]

[[example]]
name = "text_prepare_mixed_benchmark"
required-features = ["wgpu"]

[[example]]
name = "text_resize_benchmark"
required-features = ["wgpu"]

[[example]]
name = "text_scroll_benchmark"
required-features = ["wgpu"]

[[bin]]
path = "src/bin_vulkan.rs"
name = "cupid-vulkan"
required-features = ["vulkan-demo"]

[[bin]]
path = "src/bin_opengl.rs"
name = "cupid-opengl"
required-features = ["opengl-demo"]

[dependencies]
aimer_utils = { workspace = true, features = ["time-cost"] }
aimer_color.workspace = true
aimer_shape.workspace = true



#############
wgpu = { workspace = true, optional = true }
winit = { version = "0.30.12", default-features = false, optional = true, features = [
    "android-native-activity",
    "rwh_06",
    "wayland",
    "wayland-csd-adwaita-notitle",
    "wayland-dlopen",
    "x11",
] }
raw-window-handle = { workspace = true, optional = true }
bytemuck.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
# Cupid decodes PNG/JPEG/TIFF font strikes and the example image. Keep the
# image crate's broad default-format and rayon features out of this crate.
image = { workspace = true, default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
] }
thiserror.workspace = true
hashbrown.workspace = true
smallvec.workspace = true
dirs.workspace = true
memmap2 = "0.9.11"
ash = { workspace = true, optional = true }
ash-window = { workspace = true, optional = true }

[dev-dependencies]
naga = { workspace = true, features = ["spv-out"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2-core-foundation = { workspace = true, optional = true, features = [
    "std",
    "CFArray",
    "CFCharacterSet",
    "CFData",
    "CFDictionary",
    "CFLocale",
    "CFNumber",
    "CFString",
    "CFURL",
] }
objc2-core-text = { workspace = true, optional = true, features = [
    "std",
    "CTFont",
    "CTFontDescriptor",
    "CTFontManager",
    # Enables `kCTFontWeightTrait`, which is how a fallback query asks the
    # cascade for the face a bold or light run should be drawn in.
    "CTFontTraits",
    # Enables the glyph drawing and bounding-rect entry points, which take
    # Core Graphics types.
    "objc2-core-graphics",
] }
objc2-core-graphics = { workspace = true, optional = true, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGFont",
    "CGImage",
] }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true, features = [
    "std",
    "NSResponder",
    "NSView",
    "objc2-quartz-core",
] }
# NSString for shader source and labels, NSError for the fallible Metal
# constructors, NSRange/NSValue for region and clear-color plumbing.
objc2-foundation = { workspace = true, optional = true, features = [
    "std",
    "NSError",
    "NSObject",
    "NSRange",
    "NSString",
    "NSValue",
] }
objc2-quartz-core = { workspace = true, optional = true, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
] }
# The native Metal backend. Each MTL* feature turns on one generated submodule,
# so the list is exactly the surface `backend/metal.rs` touches. `bitflags` is
# required for the MTLResourceOptions / MTLTextureUsage / MTLUsagePageRange
# newtype operators.
objc2-metal = { workspace = true, optional = true, features = [
    "std",
    "bitflags",
    "block2",
    "MTLAllocation",
    "MTLArgument",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDepthStencil",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPipeline",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Response"] }


[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true }
