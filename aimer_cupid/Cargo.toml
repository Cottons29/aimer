[package]
name = "aimer_cupid"
version = "0.1.0"
edition = "2024"
description = "A rendering engine that optimized for the ui framework"

[[bin]]
path = "src/bin.rs"
name = "cupid"

[dependencies]
aimer_utils = { workspace = true, features = [] }
aimer_color.workspace = true



#############
wgpu.workspace = true
winit = { version = "0.30.12", default-features = false, features = [
    "android-native-activity",
    "rwh_06",
    "wayland",
    "wayland-csd-adwaita-notitle",
    "wayland-dlopen",
    "x11",
] }
bytemuck.workspace = true
skrifa.workspace = true
harfrust.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
image = { workspace = true, features = ["default"] }
lyon.workspace = true
thiserror.workspace = true
hashbrown.workspace = true
dirs.workspace = true
memmap2 = "0.9.11"
swash = "0.2.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
rayon = "1.12.0"

[target.'cfg(not(any(target_os = "ios", target_os = "macos")))'.dependencies]
fontique.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
core-foundation = { workspace = true }
core-foundation-sys.workspace = true
core-text = "22.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Response"] }

[dev-dependencies]
naga.workspace = true



