[application]
name = "jaime"
version = "0.0.1"
group = "com.example.jaime"


[assets]
# Files bundled into every platform package. The path below is used verbatim
# as the runtime lookup key, e.g. `AssetImage!("image.png")`.
files = [
    "assets/JAIME.md",
    "assets/image.png",
    "assets/my_image.png",
    "assets/polished_tooling.png",
    "assets/web_screenshot.png",
    "assets/ios_screenshot.png",
    "assets/macos_screenshot.png",
    "assets/android_screenshot.png",
    "assets/github-svgrepo-com.png",
    "assets/cat-svgrepo-com.svg"
]

