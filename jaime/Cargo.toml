[package]
name = "jaime"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/main.rs"

[[bin]]
name = "jaime"
path = "src/main.rs"
required-features = ["desktop-bin"]

[dependencies]

aimer = { path = "..", default-features = false, features = ["markdown", "svg", "provider"] }
aimer_widget = { path = "../crates/aimer_widget" }
uuid = { version = "1.22.0", features = ["js", "v4"] }
reqwest.workspace = true

[dev-dependencies]
aimer_attribute.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
default = ["desktop-bin", "wgpu"]
desktop-bin = []
wgpu = ["aimer/wgpu"]
metal = ["aimer/metal"]
# Native Windows Direct3D 12 renderer. Use with `--no-default-features
# --features desktop-bin,dx12` to keep the desktop binary and omit WGPU.
dx12 = ["aimer/dx12"]

# Enables the portable lowering hooks used by the application-level guest proof.
portable-guest = ["aimer/portable-guest", "aimer_widget/portable-guest"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
