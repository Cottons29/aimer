[package]
name = "aimer_quiver"
version = "0.1.0"
edition = "2024"
resolver = "3"


[features]
default = []
# Encode and present frames on a dedicated raster thread instead of inline on
# the UI thread. Off by default: it caps latency at one extra frame and moves
# the presentation outcome — and with it the first-frame notification — off the
# UI thread. Turn it on only once `frame_stats` shows encode + present are a
# meaningful share of the frame. Ignored on wasm32, which has no thread the
# WebGPU objects could move to.
raster-thread = []
# Measure build / encode / present per frame. Off by default so the render path
# reads no clock at all.
frame-stats = []

[dependencies]

aimer_widget.workspace = true
aimer_attribute.workspace = true
aimer_utils = {workspace = true, features = []}
aimer_events.workspace = true
aimer_inspector.workspace = true
aimer_canvas.workspace = true
aimer_modal.workspace = true
wgpu.workspace = true


#################


winit = {workspace = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu.workspace = true
objc.workspace = true
tokio = {workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"]}
raw-window-handle.workspace = true
aimer_cupid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.aimer_cupid]
workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-glue.workspace = true
ndk.workspace = true
rustls-platform-verifier .workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "Node", "HtmlCanvasElement", "Element", "Event", "EventTarget", "CssStyleDeclaration", "WebSocket", "MessageEvent", "ErrorEvent"] }