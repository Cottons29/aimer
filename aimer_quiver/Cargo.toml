[package]
name = "aimer_quiver"
version = "0.1.0"
edition = "2024"
resolver = "3"


[features]
default = []
# Encode and present frames on a dedicated raster thread instead of inline on
# the UI thread. Off by default: it caps latency at one extra frame and moves
# the presentation outcome — and with it the first-frame notification — off the
# UI thread. Turn it on only once `frame_stats` shows encode + present are a
# meaningful share of the frame. Ignored on wasm32, which has no thread the
# WebGPU objects could move to.
raster-thread = []
# Measure build / encode / present per frame. Off by default so the render path
# reads no clock at all.
frame-stats = []
# Enable the guest-side reflected lowering for integration tests that build an
# AWIR document and feed it through the native hot-reload materializer.
portable-guest = [
    "aimer_widget/portable-guest",
    "aimer_provider/portable-guest",
    "aimer_container/portable-guest",
    "aimer_text/portable-guest",
]
# Enable the interpreted runtime and authenticated app-side reload listener.
# This feature is selected only by `aimer +nightly run -Z hot-reload` host
# builds; ordinary native debug and release applications keep it disabled.
wasm-hot-reload = [
    "dep:aimer_reload_protocol",
    "dep:aimer_reload_server",
    "dep:aimer_anteros",
    "dep:aimer_container",
    "dep:aimer_flex",
    "dep:aimer_input",
    "dep:aimer_text",
    "aimer_anteros/wasm-hot-reload",
]

[dependencies]

aimer_animation.workspace = true
aimer_widget.workspace = true
aimer_provider.workspace = true
aimer_style.workspace = true
aimer_attribute.workspace = true
aimer_utils = {workspace = true, features = []}
aimer_events.workspace = true
aimer_inspector.workspace = true
aimer_canvas.workspace = true
aimer_modal.workspace = true
aimer_venus.workspace = true
aimer_native.workspace = true
aimer_reload_protocol = { workspace = true, optional = true }
aimer_reload_server = { workspace = true, optional = true }
aimer_anteros = { workspace = true, optional = true }
aimer_container = { workspace = true, optional = true }
aimer_flex = { workspace = true, optional = true }
aimer_input = { workspace = true, optional = true }
aimer_text = { workspace = true, optional = true }
wgpu.workspace = true

#################


winit = {workspace = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu.workspace = true
objc.workspace = true
tokio = {workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"]}
raw-window-handle.workspace = true
aimer_cupid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.aimer_cupid]
workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-glue.workspace = true
ndk.workspace = true
rustls-platform-verifier .workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "Node", "HtmlCanvasElement", "Element", "Event", "EventTarget", "CssStyleDeclaration", "WebSocket", "MessageEvent", "ErrorEvent"] }

[dev-dependencies]
aimer_macro.workspace = true
