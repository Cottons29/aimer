[package]
name = "aimer_markdown"
version = "0.1.0"
edition = "2024"

[dependencies]
aimer_utils.workspace = true
aimer_widget.workspace = true
aimer_text.workspace = true
aimer_container.workspace = true
aimer_flex.workspace = true
aimer_grid.workspace = true
aimer_scroll.workspace = true
markdown.workspace = true
aimer_assets.workspace = true
aimer_color.workspace = true
aimer_style.workspace = true
webbrowser.workspace = true
aimer_svg.workspace = true
aimer_input.workspace = true
aimer_native.workspace = true
synoptic.workspace = true
arborium = { workspace = true, features = [
    "all-languages",
], optional = true }

[features]
default = []
# Opt into the tree-sitter backed `arborium` highlighter. It understands code
# far better than the default regex based `synoptic` backend, at the cost of
# pulling in a tree-sitter grammar per language and a much heavier build.
arborium = ["dep:arborium"]

[dev-dependencies]
aimer_attribute.workspace = true
aimer_canvas.workspace = true
aimer_cupid.workspace = true
tokio.workspace = true
winit.workspace = true
