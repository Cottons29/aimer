[package]
name = "aimer_native"
version = "0.1.0"
edition = "2024"

[dependencies]


[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
objc2-ui-kit = { workspace = true, features = ["UIFeedbackGenerator"] }
objc2-foundation = "0.3.2"
objc2-core-haptics = "0.3.2"
[target.'cfg(not(target_os = "ios"))'.dependencies]

[target.'cfg(not(target_os = "android"))'.dependencies]

[target.'cfg(not(target_os = "window"))'.dependencies]


[target.'cfg(any(target_os = "macos"))'.dependencies]
objc2.workspace = true
objc2-foundation = "0.3.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = [
    "Document", "Element", "HtmlElement", "HtmlInputElement",
    "CssStyleDeclaration", "Window", "CssRule"
] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
