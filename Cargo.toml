[package]
name = "aimer"
version = "0.1.0"
edition = "2024"
description = "The organized export of other Aimer project"
repository = "https://github.com/Cottons29/aimer"
authors = ["cottons29", "lycuttons@gmail.com"]
license = "MIT"
readme = "README.md"
keywords = ["gui", "rust"]
categories = ["development-tools", "gui"]

[dependencies]
aimer_anteros.workspace = true
aimer_attribute.workspace = true
aimer_events.workspace = true
aimer_rubick.workspace = true
aimer_venus.workspace = true
aimer_widget.workspace = true
aimer_wasm_guest = { workspace = true, optional = true }
aimer_color.workspace = true
aimer_container.workspace = true
aimer_flex.workspace = true
aimer_focus.workspace = true
aimer_grid.workspace = true
aimer_haptics.workspace = true
aimer_quiver.workspace = true
aimer_input.workspace = true
aimer_scroll.workspace = true
aimer_space.workspace = true
wasm-bindgen.workspace = true
aimer_animation.workspace = true
aimer_utils.workspace = true
aimer_router.workspace = true
aimer_assets.workspace = true
aimer_style.workspace = true
aimer_text.workspace = true
aimer_macro.workspace = true
aimer_provider.workspace = true
aimer_svg.workspace = true
aimer_markdown.workspace = true
aimer_modal.workspace = true
aimer_dnd.workspace = true
aimer_native.workspace = true
aimer_ctxmenu.workspace = true
aimer_accessibility.workspace = true
aimer_selection.workspace = true
aimer_range.workspace = true
aimer_form.workspace = true
aimer_picker.workspace = true
aimer_feedback.workspace = true
aimer_navigation.workspace = true
aimer_data_view.workspace = true
aimer_i18n.workspace = true
aimer_media.workspace = true
aimer_storage.workspace = true
aimer_shape.workspace = true
aimer_collapsible.workspace = true
aimer_canvas.workspace = true
aimer_cupid.workspace = true
aimer_std.workspace = true


[dev-dependencies]
# The `http_request_button` example fetches a real URL, to show that a
# third-party async crate works on every Venus spawn path.
reqwest.workspace = true
# `tests/venus_poll_context_headless.rs` asks the async runtime whether it is
# findable while Venus polls, and awaits a timer it owns.
tokio = { workspace = true, features = ["rt", "time"] }
wgpu.workspace = true
winit.workspace = true

[features]
default = ["wgpu"]
wgpu = ["aimer_quiver/wgpu"]
markdown = []
# Forward opt-in Venus microtask diagnostics through the umbrella crate.
venus-debug = ["aimer_venus/venus-debug"]
provider = []
svg = []
apple-core-text = [
    "aimer_cupid/apple-core-text",
    "aimer_canvas/apple-core-text",
    "aimer_text/apple-core-text",
]
# Opt into the checked-in Google Sans, JetBrains Mono, and CJK faces on native
# targets. wasm already embeds its generic Latin/monospace faces because a
# browser cannot provide Cupid with readable system font files.
bundled-fonts = [
    "aimer_cupid/bundled-fonts",
    "aimer_assets/bundled-fonts",
]
# Benchmark control: compare the release flex path with its scalar kernel.
force-scalar = ["aimer_flex/force-scalar"]
# Present frames from a dedicated raster thread. Off by default — see the
# feature notes in `aimer_quiver/Cargo.toml`.
raster-thread = ["aimer_quiver/raster-thread"]
# Collect the per-frame build / encode / present breakdown.
frame-stats = ["aimer_quiver/frame-stats"]
# Present the native Quiver window through Cupid's direct Metal backend.
# Combine with `--no-default-features` to omit the default WGPU backend.
metal = ["aimer_quiver/metal"]
# Present native Windows frames through Cupid's Direct3D 12 backend.
# Use `--no-default-features --features dx12` to omit WGPU.
dx12 = ["aimer_quiver/dx12"]
# Compile ordinary widgets through the hidden portable guest conversion path.
# Generated shadow applications enable this feature; native applications do not.
portable-guest = [
    "dep:aimer_wasm_guest",
    "aimer_widget/portable-guest",
    "aimer_animation/portable-guest",
    "aimer_provider/portable-guest",
    "aimer_style/portable-guest",
    "aimer_container/portable-guest",
    "aimer_flex/portable-guest",
    "aimer_grid/portable-guest",
    "aimer_scroll/portable-guest",
    "aimer_space/portable-guest",
    "aimer_input/portable-guest",
    "aimer_text/portable-guest",
    "aimer_router/portable-guest",
    "aimer_assets/portable-guest",
    "aimer_svg/portable-guest",
    "aimer_markdown/portable-guest",
    "aimer_modal/portable-guest",
    "aimer_dnd/portable-guest",
    "aimer_ctxmenu/portable-guest",
]
# Compile the native development host with the authenticated reload listener.
# The CLI enables this only for `aimer +nightly run -Z hot-reload`.
wasm-hot-reload = ["aimer_quiver/wasm-hot-reload", "aimer_macro/hot-reload"]
# Highlight fenced code blocks with the tree-sitter backed `arborium` instead
# of the lightweight `synoptic` default. Better highlighting, heavier build.
markdown-arborium = ["aimer_markdown/arborium"]

[workspace]
resolver = "3"
members = [
    ".",
    "website",
    "aimer_quiver",
    "aimer_cupid",
    "aimer_rubick",
    "aimer_venus",
    "aimer_anteros",
    "jaime",
    "aimer_laboratory",
    "crates/aimer_widget",
    "crates/aimer_container",
    "crates/aimer_flex",
    "crates/aimer_grid",
    "crates/aimer_scroll",
    "crates/aimer_space",
    "crates/aimer_color",
    "crates/aimer_input",
    "crates/aimer_canvas",
    "crates/aimer_attribute",
    "crates/aimer_utils",
    "crates/aimer_animation",
    "crates/aimer_events",
    "crates/aimer_focus",
    "crates/aimer_router",
    "crates/aimer_assets",
    "crates/aimer_style",
    "crates/aimer_text",
    "crates/aimer_macro",
    "crates/aimer_provider",
    "crates/aimer_std",
    "website_backend",
    "crates/aimer_markdown",
    "crates/aimer_svg",
    "crates/aimer_native",
    "crates/aimer_haptics",
    "crates/aimer_modal",
    "crates/aimer_dnd",
    "crates/aimer_ffi_utils"
    , "crates/aimer_ctxmenu",
    "crates/aimer_reload_protocol",
    "crates/aimer_reload_server",
    "crates/aimer_wasm_guest",
    "crates/aimer_accessibility",
    "crates/aimer_selection",
    "crates/aimer_range",
    "crates/aimer_form",
    "crates/aimer_picker",
    "crates/aimer_feedback",
    "crates/aimer_navigation",
    "crates/aimer_data_view",
    "crates/aimer_i18n",
    "crates/aimer_media",
    "crates/aimer_storage",
    "crates/aimer_shape",
    "crates/aimer_collapsible",
]

[workspace.dependencies]
aimer_cupid = { path = "aimer_cupid", default-features = false, features = ["apple-core-text"] }
aimer_rubick = { path = "aimer_rubick" }
aimer_venus = { path = "aimer_venus" }
aimer_quiver = { path = "aimer_quiver", default-features = false }
aimer_canvas = { path = "crates/aimer_canvas" }
aimer_animation = { path = "crates/aimer_animation" }
aimer_input = { path = "crates/aimer_input" }
aimer_container = { path = "crates/aimer_container" }
aimer_flex = { path = "crates/aimer_flex" }
aimer_grid = { path = "crates/aimer_grid" }
aimer_scroll = { path = "crates/aimer_scroll" }
aimer_space = { path = "crates/aimer_space" }
aimer_widget = { path = "crates/aimer_widget" }
aimer_color = { path = "crates/aimer_color" }
aimer_attribute = { path = "crates/aimer_attribute" }
aimer_utils = { path = "crates/aimer_utils" }
aimer_events = { path = "crates/aimer_events" }
aimer_focus = { path = "crates/aimer_focus" }
aimer_text = { path = "crates/aimer_text" }
aimer_router = { path = "crates/aimer_router" }
aimer_assets = { path = "crates/aimer_assets" }
aimer_style = { path = "crates/aimer_style" }
aimer_std = { path = "crates/aimer_std" }
aimer_macro = { path = "crates/aimer_macro" }
aimer_provider = { path = "crates/aimer_provider" }
aimer_svg = { path = "crates/aimer_svg" }
aimer_markdown = { path = "crates/aimer_markdown" }
aimer_modal = { path = "crates/aimer_modal" }
aimer_dnd = { path = "crates/aimer_dnd" }
aimer_accessibility = { path = "crates/aimer_accessibility" }
aimer_selection = { path = "crates/aimer_selection" }
aimer_range = { path = "crates/aimer_range" }
aimer_form = { path = "crates/aimer_form" }
aimer_picker = { path = "crates/aimer_picker" }
aimer_feedback = { path = "crates/aimer_feedback" }
aimer_navigation = { path = "crates/aimer_navigation" }
aimer_data_view = { path = "crates/aimer_data_view" }
aimer_i18n = { path = "crates/aimer_i18n" }
aimer_media = { path = "crates/aimer_media" }
aimer_storage = { path = "crates/aimer_storage" }
aimer_shape = { path = "crates/aimer_shape" }
aimer_collapsible = { path = "crates/aimer_collapsible" }
aimer_native = { path = "crates/aimer_native" }
aimer_haptics = { path = "crates/aimer_haptics" }
aimer_ctxmenu = { path = "crates/aimer_ctxmenu" }
aimer_anteros = { path = "aimer_anteros" }
aimer_reload_protocol = { path = "crates/aimer_reload_protocol" }
aimer_reload_server = { path = "crates/aimer_reload_server" }
aimer_wasm_guest = { path = "crates/aimer_wasm_guest" }

# Generic Dependencies

console_error_panic_hook = "0.1.7"
winit = { version = "0.30.12", features = ["android-native-activity"] }
raw-window-handle = "0.6.2"
web-time = "1.1.0"
hashbrown = "0.17.1"
crossbeam = "0.8.4"
tokio = "1.52.3"
futures-util = "0.3.31"
once_cell = "1.21.4"
smallvec = { version = "1.13.2", features = ["const_new"] }
url = "2.5.8"
serde = { version = "1.0.228", features = ["default", "derive"] }
serde_json = "1.0.150"
wgpu = { version = "30.0.0", features = ["gles", "webgl", "web"] }
ash = "0.38.0"
ash-window = "0.13.0"
image = { version = "0.25.10", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "http2"] }
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
openssl = { version = "0.10.81", features = ["vendored"] }
uuid = { version = "1.23.5", features = ["js", "v4", "serde"] }
dirs = "6.0.0"
webbrowser = "1.2.4"
naga = { version = "30.0.0", features = ["wgsl-in"] }

# Markdown - Optinal Feature

markdown = "1.0.0"
arborium = "2.18.0"
synoptic = "2.2.9"


# Macros Dependencies
# f033ef1403b4dbd276d95c26ff05b51d758d7b14 | https://github.com/dtolnay/syn.git
syn = { version = "2.0.118", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.46"
proc-macro-crate = "3.5.0"

# Font Utils

bytemuck = { version = "1.25.1", features = ["derive"] }
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"

# Hot Reload  - Experimental Feature

linkme = "0.3.35"
wasmi = { version = "1.1.0", default-features = false, features = ["std"] }
wasmparser = { version = "0.239.0", default-features = false }

# Web Deps

wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["CanvasRenderingContext2d", "Clipboard", "DomMatrix", "Navigator", "TextMetrics", "Window"] }
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"

# Android Family

jni = "0.22.4"
ndk-glue = "0.7.0"
ndk = "0.9.0"
ndk-context = "0.1.1"

# Apple Family

objc = { version = "0.2.7" }
muda = "0.19.3"
objc2-ui-kit = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2 = "0.6.4"
objc2-core-text = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
# Cupid's native Metal backend. Default features are off because they drag in
# dispatch2 and every MTL4* module; member crates opt into the specific
# MTL* submodules they need, mirroring wgpu-hal's own selection.
objc2-metal = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false }
# Opt-in native Direct3D 12 bindings used by Cupid and Quiver on Windows.
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }

# Aimer cli dependencies

colored = "3.1.1"
arboard = "3.6.1"
thiserror = "2.0.18"
toml = "1.1.2+spec-1.1.0"
tempfile = "3.27.0"
sha2 = "0.11.0"
hex = "0.4.3"
ring = "0.17.14"
subtle = "2.6.1"
zeroize = "1.8.2"
rustls-platform-verifier = { version = "0.7.0", features = ["jni"] }
axum = { version = "0.8.6", default-features = false }
tower = "0.5.2"
tower-service = "0.3.3"
tower-http = { version = "0.7.0", default-features = false, features = ["cors"] }
worker = { version = "0.8.5", default-features = false }
worker-macros = { version = "0.8.5", default-features = false }

[profile.dev.package.aimer_rubick]
opt-level = 3

[profile.dev.package.aimer_venus]
opt-level = 3

[profile.release]
opt-level = 3
debug-assertions = false
codegen-units = 1
lto = true
split-debuginfo = "packed"
panic = "abort"
strip = "symbols"


[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(aimer_portable_guest)'] }
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(aimer_portable_guest)'] }
