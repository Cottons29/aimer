proc-macro-crate = "3.5.0"

# Font Utils

bytemuck = { version = "1.25.1", features = ["derive"] }
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"

# Hot Reload

walrus = "0.26.5"
linkme = "0.3.35"
wasmi = { version = "1.1.0", default-features = false, features = ["std"] }
wasmparser = { version = "0.239.0", default-features = false }

# Web Deps

wasm-bindgen = "0.2.126"
wasm-bindgen-cli-support = "0.2.126"
web-sys = { version = "0.3.103", features = ["CanvasRenderingContext2d", "Clipboard", "DomMatrix", "Navigator", "TextMetrics", "Window"] }
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"

# Android Family

jni = "0.22.4"
ndk-glue = "0.7.0"
ndk = "0.9.0"
ndk-context = "0.1.1"

# Apple Family

objc = { version = "0.2.7" }
muda = "0.19.3"
objc2-ui-kit = "0.3.2"
objc2-app-kit = "0.3.2"
objc2 = "0.6.4"
objc2-core-text = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }

# Aimer cli dependencies

colored = "3.1.1"
crossterm = "0.29.0"
ctrlc = "3.5.2"
clap = { version = "4.6.1", features = ["derive"] }
inquire = "0.9.4"
ratatui = "0.30.2"
ansi-to-tui = "8.0.1"
arboard = "3.6.1"
clap_complete = { version = "4.6.7", features = ["unstable-dynamic"] }
notify = "9.0.0-rc.4"
thiserror = "2.0.18"
anyhow = "1.0.103"
toml = "1.1.2+spec-1.1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
sha2 = "0.11.0"
hex = "0.4.3"
ring = "0.17.14"
subtle = "2.6.1"
zeroize = "1.8.2"
rustls-platform-verifier = { version = "0.7.0", features = ["jni"] }
axum = { version = "0.8.6", default-features = false }
tower = "0.5.2"
tower-service = "0.3.3"
tower-http = { version = "0.7.0", default-features = false, features = ["cors"] }
worker = { version = "0.8.5", default-features = false }
worker-macros = { version = "0.8.5", default-features = false }


# `aimer_rubick` is the ownership primitive behind every widget and element.
# Its inline storage, its static operation tables and its block pool are thin
# abstractions that only pay for themselves once the compiler inlines them; at
# `opt-level = 0` a thread-local free list costs more than the allocator it
# replaces. Optimizing this one crate keeps debug builds of an application fast
# without touching the debuggability of application code.
[profile.dev.package.aimer_rubick]
opt-level = 3

# `aimer_venus` schedules every asynchronous task in an application, inside a
# frame that is 8.3 ms long at 120 Hz. Its slab indexing, its generational id
# checks and its waker are the same kind of thin abstraction as `aimer_rubick`'s:
# free once inlined, and a measurable per-task cost at `opt-level = 0`. Debug
# builds of an application should not pay a microsecond per microtask.
[profile.dev.package.aimer_venus]
opt-level = 3

[profile.release]
opt-level = 3
debug-assertions = false
codegen-units = 1
lto = true
split-debuginfo = "packed"
panic = "abort"
strip = "symbols"


[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(aimer_portable_guest)'] }
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(aimer_portable_guest)'] }
