[package]
name = "website_backend"
version = "0.2.0"
edition = "2024"

# `cdylib` is what `worker-build` compiles to WebAssembly; `rlib` keeps the
# router testable on the host toolchain.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tower-http.workspace = true

# The Workers runtime only exists inside the WebAssembly target, so the bindings
# are compiled there alone. Everything above stays portable, which is what lets
# `cargo test` exercise the same router natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { workspace = true, features = ["http", "axum"] }
worker-macros = { workspace = true, features = ["http"] }
tower-service.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower.workspace = true
