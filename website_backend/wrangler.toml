# Cloudflare Workers + Containers deployment for the Aimer blog API.
#
# `npx wrangler deploy` (from this directory) builds `Dockerfile` with the
# repository root as its build context — `website_backend` is a workspace
# member, so Cargo needs the whole workspace — pushes the image to the
# Cloudflare managed registry, and deploys the Worker in `worker/index.ts`.
# Docker must be running locally for the build step.

name = "aimer-website-backend"
main = "worker/index.ts"
compatibility_date = "2026-07-01"

# Settings handed to the container process as environment variables. They are
# the same keys the binary reads from `.env` during local development, so the
# deployment is configured here instead of baking a file into the image.
[vars]
SERVER_IP = "0.0.0.0"
SERVER_PORT = "3200"
SERVER_CORS = "https://aimers.dev,http://localhost:3000"

[observability]
enabled = true

[[containers]]
class_name = "AimerApiContainer"
image = "./Dockerfile"
image_build_context = ".."
instance_type = "basic"
max_instances = 5

[[durable_objects.bindings]]
name = "AIMER_API_CONTAINER"
class_name = "AimerApiContainer"

# Containers are backed by Durable Objects, which must be SQLite backed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AimerApiContainer"]
