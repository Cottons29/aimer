# Cloudflare Worker deployment for the Aimer blog API.
#
# The Worker is the `website_backend` crate compiled to WebAssembly: there is no
# container and no Durable Object any more. `npx wrangler deploy` (from this
# directory) runs the build command below, which invokes `worker-build` to
# produce `build/index.js` plus the `.wasm` module, and uploads the result.
# Docker is no longer needed — only the `wasm32-unknown-unknown` target:
#
#     rustup target add wasm32-unknown-unknown

name = "aimer-website-backend"
main = "build/index.js"
compatibility_date = "2026-07-01"

# Two workspace settings have to be overridden for this crate:
#
# * `RUSTFLAGS` replaces the `.cargo/config.toml` flags, which enable the
#   `atomics` target feature for the threaded Aimer web build. Workers have no
#   shared memory, so the Worker is compiled without it.
# * `strip = "symbols"` in the workspace release profile removes the symbols
#   `wasm-bindgen` needs to generate the panic recovery wrappers, which fails
#   the build with `externref table required for catch wrappers`. `wasm-opt`,
#   which `worker-build` runs anyway, shrinks the module instead.
[build]
command = "cargo install -q \"worker-build@^0.8\" && RUSTFLAGS=\"-C target-feature=+bulk-memory\" CARGO_PROFILE_RELEASE_STRIP=false worker-build --release"

# The only runtime setting left: the browsers origins allowed to call the API.
# The blog content itself is embedded in the module at compile time.
[vars]
SERVER_CORS = "https://aimers.dev,aimers.dev,http://localhost:3000"

[observability]
enabled = true

# The container was backed by a Durable Object, and a class is only detached
# from a deployed Worker by a migration that names it. Migrations are a history
# rather than a state, so `v1` — the one that created the class — stays.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AimerApiContainer"]

[[migrations]]
tag = "v2"
deleted_classes = ["AimerApiContainer"]
